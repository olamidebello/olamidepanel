name: Build Africa Weather Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['deploy/africaweather/mobile/**', '.github/workflows/africaweather-mobile.yml']
permissions:
  contents: write
concurrency:
  group: africaweather-android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and verify development APK
        working-directory: deploy/africaweather/mobile
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk AfricaWeather.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose AfricaWeather.apk
          sha256sum AfricaWeather.apk > AfricaWeather.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AfricaWeather-Android
          path: deploy/africaweather/mobile/AfricaWeather.apk*
      - name: Publish Android development download
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "africaweather-android-${{ github.run_number }}-${{ github.run_attempt }}" deploy/africaweather/mobile/AfricaWeather.apk* --title "Africa Weather Android development build" --notes "Shared app for the Africa directory and country editions. Debug signed; updates may require reinstalling. Internet required. Not a Play Store release." --latest
