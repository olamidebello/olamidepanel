plugins { id 'com.android.application' }
android {
    namespace 'world.africandroid.africaweather'
    compileSdk 35
    defaultConfig {
        applicationId 'world.africandroid.africaweather'
        minSdk 23
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
        versionName System.getenv('APP_VERSION_NAME') ?: '1.0'
    }
}
