---
- name: Bootstrap a bare Debian 12 host with Oracle MySQL
  hosts: panel_servers
  become: true
  gather_facts: true
  vars:
    panel_mysql_key_url: https://repo.mysql.com/RPM-GPG-KEY-mysql-2025
  pre_tasks:
    - name: Check platform
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Debian'
          - ansible_distribution_major_version == '12'
          - ansible_architecture == 'x86_64'
        fail_msg: This installer requires Debian 12 amd64.
    - name: Create private bootstrap configuration directory
      ansible.builtin.file:
        path: /etc/olamidepanel
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Generate or reuse initial database and administrator passwords
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "{{ lookup('file', playbook_dir + '/../deploy/bootstrap_passwords.py') }}"
          - /etc/olamidepanel/bootstrap-credentials.json
        stdin: '{{ {"panel_mysql_root_password": panel_mysql_root_password | default(""), "panel_mysql_password": panel_mysql_password | default(""), "panel_admin_password": panel_admin_password | default(""), "panel_admin_username": panel_admin_username | default("owner")} | to_json }}'
      no_log: true
      register: panel_bootstrap_secrets
      changed_when: false
      when: not ansible_check_mode
    - name: Load effective bootstrap credentials
      ansible.builtin.set_fact:
        panel_effective_mysql_root_password: '{{ (panel_bootstrap_secrets.stdout | from_json).panel_effective_mysql_root_password }}'
        panel_effective_mysql_password: '{{ (panel_bootstrap_secrets.stdout | from_json).panel_effective_mysql_password }}'
        panel_effective_admin_password: '{{ (panel_bootstrap_secrets.stdout | from_json).panel_effective_admin_password }}'
      no_log: true
      when: not ansible_check_mode
    - name: Evaluate settings without exposing their values
      ansible.builtin.set_fact:
        panel_validation_checks:
          hostname: "{{ (panel_hostname | default('') | string) is match('^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)+$') }}"
          acme_email: "{{ ((panel_acme_email | default('') | string) is match('^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$')) and (panel_acme_email | default('') not in ['operator@example.com', 'YOUR_EMAIL_ADDRESS']) }}"
          mysql_root_password: "{{ (panel_effective_mysql_root_password | default('') | string | length >= 20) and not ((panel_effective_mysql_root_password | default('') | string) is search('REPLACE_WITH|YOUR_')) }}"
          mysql_application_password: "{{ (panel_effective_mysql_password | default('') | string | length >= 20) and not ((panel_effective_mysql_password | default('') | string) is search('REPLACE_WITH|YOUR_')) }}"
          admin_username: "{{ (panel_admin_username | default('') | string) is match('^[a-z][a-z0-9_]{2,31}$') }}"
          admin_password: "{{ (panel_effective_admin_password | default('') | string | length >= 14) and not ((panel_effective_admin_password | default('') | string) is search('REPLACE_WITH|YOUR_')) }}"
      no_log: true
    - name: Report invalid setting names only
      ansible.builtin.assert:
        that: item.value | bool
        fail_msg: 'Invalid or missing setting: {{ item.key }}. Correct it using ansible-vault edit. Passwords are never printed.'
      loop: '{{ panel_validation_checks | dict2items }}'
      loop_control:
        label: '{{ item.key }}'
    - name: Inspect existing MySQL data
      ansible.builtin.stat:
        path: /var/lib/mysql/mysql
      register: existing_mysql
    - name: Inspect managed-install marker
      ansible.builtin.stat:
        path: /etc/olamidepanel/bare-install-managed
      register: managed_install
    - name: Protect unrelated existing MySQL installations
      ansible.builtin.assert:
        that: not existing_mysql.stat.exists or managed_install.stat.exists
        fail_msg: Existing MySQL is not managed by this playbook. Use the existing-server setup guide instead.
  tasks:
    - name: Install base dependencies
      ansible.builtin.apt:
        name: [acl, ca-certificates, curl, gnupg, git, python3, python3-venv, nginx, certbot, python3-certbot-nginx]
        update_cache: true
        state: present
    - name: Download Oracle repository signing key
      ansible.builtin.get_url:
        url: '{{ panel_mysql_key_url }}'
        dest: /usr/share/keyrings/olamide-mysql.asc
        mode: '0644'
        force: false
    - name: Configure signed Oracle MySQL 8.4 LTS repository
      ansible.builtin.apt_repository:
        repo: deb [arch=amd64 signed-by=/usr/share/keyrings/olamide-mysql.asc] https://repo.mysql.com/apt/debian/ bookworm mysql-8.4-lts
        filename: olamide-mysql
        state: present
        update_cache: true
    - name: Set fresh MySQL root-password installer answers
      ansible.builtin.debconf:
        name: mysql-community-server
        question: '{{ item }}'
        value: '{{ panel_effective_mysql_root_password }}'
        vtype: password
      loop:
        - mysql-community-server/root-pass
        - mysql-community-server/re-root-pass
      no_log: true
      when: not existing_mysql.stat.exists
    - name: Install Oracle MySQL server
      ansible.builtin.apt:
        name: mysql-server
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive
    - name: Bind MySQL to loopback
      ansible.builtin.copy:
        dest: /etc/mysql/mysql.conf.d/olamide-network.cnf
        content: |
          [mysqld]
          bind-address=127.0.0.1
          mysqlx-bind-address=127.0.0.1
        mode: '0644'
      notify: Restart MySQL
    - name: Enable MySQL service
      ansible.builtin.systemd:
        name: mysql
        enabled: true
        state: started
    - name: Apply MySQL configuration
      ansible.builtin.meta: flush_handlers
    - name: Wait for local MySQL
      ansible.builtin.wait_for:
        port: 3306
        host: 127.0.0.1
        timeout: 60
    - name: Create deployment directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop: [/etc/olamidepanel, /opt/olamidepanel]
    - name: Record managed bootstrap
      ansible.builtin.copy:
        dest: /etc/olamidepanel/bare-install-managed
        content: "OlamidePanel bare Debian 12 bootstrap\n"
        force: false
        mode: '0600'
  handlers:
    - name: Restart MySQL
      ansible.builtin.systemd:
        name: mysql
        state: restarted

- name: Provision the application database
  ansible.builtin.import_playbook: configure-mysql.yml

- name: Deploy OlamidePanel and enable HTTPS
  hosts: panel_servers
  become: true
  vars:
    panel_revision: main
    panel_repository: https://github.com/olamidebello/olamidepanel.git
  tasks:
    - name: Checkout application source without discarding local changes
      ansible.builtin.git:
        repo: '{{ panel_repository }}'
        dest: /opt/olamidepanel/repo
        version: '{{ panel_revision }}'
        force: false
      notify: Restart panel
    - name: Install application files
      ansible.builtin.copy:
        src: /opt/olamidepanel/repo/panel/
        dest: /opt/olamidepanel/panel/
        remote_src: true
        owner: root
        group: root
        mode: preserve
      notify: Restart panel
    - name: Install application requirements
      ansible.builtin.pip:
        requirements: /opt/olamidepanel/repo/requirements.txt
        virtualenv: /opt/olamidepanel/venv
      notify: Restart panel
    - name: Generate persistent gateway encryption key without replacing existing key
      ansible.builtin.command:
        argv:
          - /opt/olamidepanel/venv/bin/python
          - -c
          - |
            import os
            from cryptography.fernet import Fernet
            fd=os.open('/etc/olamidepanel/payment.key',os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
            with os.fdopen(fd,'wb') as f: f.write(Fernet.generate_key())
        creates: /etc/olamidepanel/payment.key
      no_log: true
    - name: Protect gateway encryption key
      ansible.builtin.file:
        path: /etc/olamidepanel/payment.key
        owner: root
        group: olamidepanel
        mode: '0640'
    - name: Configure public HTTPS origin
      ansible.builtin.copy:
        dest: /etc/olamidepanel/runtime.env
        content: |
          PANEL_PUBLIC_URL=https://{{ panel_hostname }}
          PANEL_ENABLE_LIVE_PAYMENTS={{ (panel_enable_live_payments | default(false) | bool) | ternary('1','0') }}
        owner: root
        group: olamidepanel
        mode: '0640'
      notify: Restart panel
    - name: Create private account storage
      ansible.builtin.file:
        path: /var/lib/olamidepanel
        state: directory
        owner: olamidepanel
        group: olamidepanel
        mode: '0700'
    - name: Install hardened service unit
      ansible.builtin.copy:
        src: /opt/olamidepanel/repo/deploy/olamidepanel.service
        dest: /etc/systemd/system/olamidepanel.service
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      notify: Restart panel
    - name: Initialize schema and register initial panel root
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /opt/olamidepanel/repo/deploy/provision_bootstrap.py
        chdir: /tmp
      register: bootstrap_account
      changed_when: bootstrap_account.rc == 0 and ((bootstrap_account.stdout | from_json).changed | default(false))
      failed_when: false
      no_log: true
      when: not ansible_check_mode
    - name: Verify bootstrap account result with redacted diagnostics
      ansible.builtin.assert:
        that: bootstrap_account.rc == 0
        fail_msg: 'Bootstrap result (redacted): {{ bootstrap_account.stdout | default("No result returned") }}'
      when: not ansible_check_mode
    - name: Install paid service activation worker
      ansible.builtin.copy:
        src: '/opt/olamidepanel/repo/deploy/{{ item }}'
        dest: '/etc/systemd/system/{{ item }}'
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      loop: [olamidepanel-fulfillment.service, olamidepanel-fulfillment.timer]
    - name: Enable automatic paid service activation
      ansible.builtin.systemd:
        name: olamidepanel-fulfillment.timer
        enabled: true
        state: started
        daemon_reload: true
    - name: Create initial Nginx virtual host without overwriting issued TLS configuration
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/olamidepanel
        force: false
        mode: '0644'
        content: |
          server {
            listen 80;
            server_name {{ panel_hostname }};
            client_max_body_size 2m;
            location / {
              proxy_pass http://127.0.0.1:8090;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto $scheme;
            }
          }
      notify: Reload Nginx
    - name: Set bounded upload limit while preserving existing TLS configuration
      ansible.builtin.lineinfile:
        path: /etc/nginx/sites-available/olamidepanel
        regexp: '^\s*client_max_body_size\s+'
        line: '  client_max_body_size 16m;'
        insertafter: '^server \{'
      notify: Reload Nginx
    - name: Enable panel virtual host
      ansible.builtin.file:
        src: /etc/nginx/sites-available/olamidepanel
        dest: /etc/nginx/sites-enabled/olamidepanel
        state: link
      notify: Reload Nginx
    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false
    - name: Enable application and Nginx services
      ansible.builtin.systemd:
        name: '{{ item }}'
        state: started
        enabled: true
        daemon_reload: true
      loop: [olamidepanel, nginx]
    - name: Apply service updates before checking readiness
      ansible.builtin.meta: flush_handlers
    - name: Check backend responds
      ansible.builtin.uri:
        url: http://127.0.0.1:8090/
        status_code: 200
      register: backend_ready
      retries: 6
      delay: 2
      until: backend_ready.status == 200
    - name: Obtain certificate and enable HTTP to HTTPS redirect
      ansible.builtin.command:
        argv:
          - certbot
          - --nginx
          - --non-interactive
          - --agree-tos
          - --email
          - '{{ panel_acme_email }}'
          - -d
          - '{{ panel_hostname }}'
          - --redirect
        creates: '/etc/letsencrypt/live/{{ panel_hostname }}/fullchain.pem'
    - name: Enable certificate renewal timer
      ansible.builtin.systemd:
        name: certbot.timer
        enabled: true
        state: started
    - name: Verify HTTPS locally with hostname and certificate validation
      ansible.builtin.command:
        argv: [curl, --fail, --silent, --show-error, --resolve, '{{ panel_hostname }}:443:127.0.0.1', 'https://{{ panel_hostname }}/', -o, /dev/null]
      changed_when: false
    - name: Show deployed URL
      ansible.builtin.debug:
        msg: 'OlamidePanel deployed at https://{{ panel_hostname }}. Planned hosting modules remain unimplemented.'
  handlers:
    - name: Restart panel
      ansible.builtin.systemd:
        name: olamidepanel
        state: restarted
        daemon_reload: true
    - name: Reload Nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
