---
# Run on the hosting server:
# ansible-playbook -i localhost, -c local ansible/install-africandroid-adsense.yml
# Extra HTML/template roots can be supplied with -e '{"adsense_extra_roots":["/path"]}'.
- name: Install AfricAndroid and WeatherNigeria AdSense code
  hosts: all
  become: true
  vars:
    adsense_domains:
      - africandroid.world
      - weathernigeria.africandroid.world
    adsense_extra_roots: []
    adsense_source_roots:
      - /opt/africandroid-website-source
      - /opt/olamide-weather/nigeria/static
    adsense_code: '<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3481003274143556" crossorigin="anonymous"></script>'
  tasks:
    - name: Read effective nginx configuration without changing it
      ansible.builtin.command: nginx -T
      register: adsense_nginx
      changed_when: false
      check_mode: false

    - name: Add code inside HTML heads with backups and duplicate protection
      ansible.builtin.command:
        argv: [python3, -c, "{{ adsense_installer }}"]
        stdin: "{{ {'nginx': adsense_nginx.stdout, 'domains': adsense_domains, 'roots': adsense_source_roots + adsense_extra_roots, 'code': adsense_code, 'check': ansible_check_mode} | to_json }}"
      vars:
        adsense_installer: |
          import json, sys, re, pathlib, shutil, datetime, os
          cfg = json.load(sys.stdin)
          roots = set(cfg['roots'])
          # Collect root directives only from server blocks for the requested hosts.
          text = cfg['nginx']
          for match in re.finditer(r'\bserver\s*\{', text):
              start, depth, pos = match.end(), 1, match.end()
              while pos < len(text) and depth:
                  depth += (text[pos] == '{') - (text[pos] == '}')
                  pos += 1
              block = text[start:pos-1]
              names = re.findall(r'\bserver_name\s+([^;]+);', block)
              if any(set(n.split()) & set(cfg['domains']) for n in names):
                  roots.update(re.findall(r'\broot\s+([^;\s]+)\s*;', block))
          files = set()
          for root in roots:
              p = pathlib.Path(root)
              if p.is_dir() and '$' not in root:
                  for ext in ('*.html', '*.htm'):
                      files.update(x for x in p.rglob(ext) if not x.is_symlink() and
                                   not any(v in x.parts for v in ('.git', 'node_modules', '.venv')))
          if not files:
              sys.exit('No HTML files found. Set adsense_extra_roots to the deployed document/template roots.')
          changes, ready = [], []
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%S%fZ')
          for path in sorted(files):
              original = path.read_text(encoding='utf-8')
              head = re.search(r'<head\b[^>]*>.*?</head\s*>', original, re.I | re.S)
              if not head:
                  continue
              current = head.group()
              # Refuse another publisher rather than silently replacing its configuration.
              if re.search(r'ca-pub-(?!3481003274143556\b)\d+', current):
                  sys.exit('Conflicting publisher in ' + str(path))
              if 'ca-pub-3481003274143556' in current and 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' in current:
                  ready.append(str(path))
                  continue
              updated = original[:head.start()] + re.sub(r'</head\s*>', cfg['code'] + '\n</head>', current, count=1, flags=re.I) + original[head.end():]
              if not cfg['check']:
                  backup = str(path) + '.adsense-backup-' + stamp
                  shutil.copy2(path, backup)
                  temporary = str(path) + '.adsense-tmp'
                  try:
                      shutil.copy2(path, temporary)
                      with open(temporary, 'w', encoding='utf-8') as out:
                          out.write(updated)
                      stat = path.stat()
                      os.chown(temporary, stat.st_uid, stat.st_gid)
                      os.replace(temporary, path)
                  finally:
                      if os.path.exists(temporary):
                          os.unlink(temporary)
              changes.append(str(path))
          if not changes and not ready:
              sys.exit('No literal HTML head found; supply the application template directory.')
          print(json.dumps({'changed': changes, 'already_installed': ready, 'check_mode': cfg['check']}))
      register: adsense_install
      changed_when: (adsense_install.stdout | from_json).changed | length > 0
      check_mode: false

    - name: Show installed files
      ansible.builtin.debug:
        msg: "{{ adsense_install.stdout | from_json }}"

    - name: Verify code in the public HTTPS page head
      ansible.builtin.uri:
        url: "https://{{ item }}/"
        return_content: true
        validate_certs: true
        status_code: 200
      loop: "{{ adsense_domains }}"
      register: adsense_public
      failed_when: >-
        adsense_public.status != 200 or
        (adsense_public.content | regex_search('(?is)<head\\b[^>]*>.*?ca-pub-3481003274143556.*?</head\\s*>')) is none
      when: not ansible_check_mode
