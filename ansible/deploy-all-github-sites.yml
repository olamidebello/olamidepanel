# Single-file GitHub deployment for 181.214.149.146 (Debian/Ubuntu).
# Run ON THE HOST as root after installing ansible-core:
# ansible-playbook -i localhost, -c local deploy-all-github-sites.yml
# Remote: ansible-playbook -i 181.214.149.146, -u root deploy-all-github-sites.yml
# Requires working outbound GitHub/APT/ACME access and inbound TCP 80/443.
# DNS: apex A=181.214.149.146; www CNAME=apex; no AAAA for IPv4-only hosting.
# Default: check main hourly and automatically deploy new commits from these repos.
# Disable schedule: -e deployment_auto_update=false
# Generated initial admin credentials (root only):
#   /var/lib/olamide-github-deploy/credentials/{africanappsstore,dobhrap}.json
# Existing administrators are preserved, not reset by generated credentials.
# Status: /var/lib/olamide-github-deploy/status.json
# Logs: journalctl -u olamide-github-deploy.service
# Backups: /var/lib/olamide-github-deploy/backups (no automatic deletion).
# Retry now: systemctl start olamide-github-deploy.service
# This supersedes the old six-domain static-hosting TIMER to prevent proxy rewrites.
# Existing unrelated Nginx sites are never removed; conflicting vhosts are reported.
# Panel updates require its existing service, virtualenv and MySQL configuration.
# Panel data/MySQL are backed up before updating; schema rollback needs operator review.
# AfricanBrowser builds its complete public website and links the published development APK.
# Personal domain is skipped until explicitly mapped: -e personal_site_repo=olamidebello/NAME
# Its prebuilt static files must be in public/index.html; other stacks need an adapter.
# To add its repo, edit deployment_sites below; add an adapter for its actual stack.
# No fabricated full-platform implementation or DNS-provider access is included.
# Check mode is not supported: use --syntax-check for a non-mutating validation.
---
- name: Pull and deploy all available operator GitHub projects
  hosts: all
  become: true
  gather_facts: true
  vars:
    deployment_ipv4: 181.214.149.146
    deployment_email: dobcalldemo@gmail.com
    deployment_auto_update: true
    personal_site_repo: ''
    deployment_sites:
    - domain: africanappsstore.space
      repo: olamidebello/africanappsstore
      kind: store
      service: africanappsstore
      user: africanstore
      port: 18081
      health: /api/health
      adopt_service: true
    - domain: africanbrowser.com
      repo: olamidebello/AfricanBrowser
      kind: browser
    - domain: dobhrap.com
      repo: olamidebello/DOBHRAP
      kind: dobhrap
      service: dobhrap
      user: dobhrap
      port: 18082
      health: /health
      adopt_service: true
    - domain: nekkeddating.com
      repo: olamidebello/Nekked-Dating
      kind: dating
      service: nekkeddating
      user: nekkeddating
      port: 18083
      health: /
    - domain: olamideolatayobello.com
      repo: '{{ personal_site_repo }}'
      kind: static
      public_dir: public
    - domain: olamidepanel.com
      repo: olamidebello/olamidepanel
      kind: panel
      port: 8090
  pre_tasks:
  - name: Reject unsupported check mode
    ansible.builtin.fail:
      msg: Use --syntax-check; live git, backup and certificate steps cannot be simulated.
    when: ansible_check_mode
  tasks:
  - name: Require supported OS and valid operator email
    ansible.builtin.assert:
      that:
      - ansible_facts.os_family == 'Debian'
      - deployment_email is match('^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}$')
      fail_msg: Use Debian/Ubuntu and set deployment_email.
  - name: Validate explicit domain and repository mapping
    ansible.builtin.assert:
      that:
      - item.domain is match('^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?[.])+[a-z]{2,63}$')
      - item.repo == '' or item.repo is match('^olamidebello/[A-Za-z0-9_.-]+$')
      - item.kind in ['store', 'dobhrap', 'dating', 'panel', 'browser', 'static']
      fail_msg: Set a supported deployment kind when adding an application; arbitrary build commands are not guessed.
    loop: '{{ deployment_sites }}'
  - name: Install deployment and HTTPS prerequisites
    ansible.builtin.apt:
      name:
      - git
      - python3
      - python3-venv
      - python3-pip
      - python3-dnspython
      - nginx
      - certbot
      - python3-certbot-nginx
      - ca-certificates
      state: present
      update_cache: true
      cache_valid_time: 3600
  - name: Validate current Nginx configuration
    ansible.builtin.command: nginx -t
    changed_when: false
  - name: Create root-owned deployment directories
    ansible.builtin.file:
      path: '{{ item.path }}'
      state: directory
      owner: root
      group: root
      mode: '{{ item.mode }}'
    loop:
    - path: /var/lib/olamide-github-deploy
      mode: '0755'
    - path: /var/lib/olamide-github-deploy/sources
      mode: '0700'
    - path: /var/lib/olamide-github-deploy/backups
      mode: '0700'
    - path: /var/lib/olamide-github-deploy/credentials
      mode: '0700'
    - path: /var/lib/olamide-github-deploy/status
      mode: '0755'
    - path: /var/lib/olamide-github-deploy/releases
      mode: '0755'
    - path: /var/lib/olamide-github-deploy/public
      mode: '0755'
    - path: /var/lib/olamide-github-deploy/public/africanbrowser.com
      mode: '0755'
    - path: /var/lib/olamide-six-domains/acme
      mode: '0755'
    - path: /var/lib/olamide-github-deploy/releases/africanappsstore
      mode: '0755'
    - path: /var/lib/olamide-github-deploy/releases/dobhrap
      mode: '0755'
    - path: /var/lib/olamide-github-deploy/releases/nekkeddating
      mode: '0755'
    - path: /var/lib/olamide-github-deploy/releases/olamidepanel
      mode: '0755'
  - name: Save operator deployment configuration
    ansible.builtin.copy:
      dest: /etc/olamide-github-deploy.json
      owner: root
      group: root
      mode: '0600'
      content: '{{ {"server_ipv4": deployment_ipv4, "admin_email": deployment_email, "sites": deployment_sites}
        | to_nice_json }}'
  - name: Install embedded deployment worker
    tags: [deployment_worker]
    ansible.builtin.copy:
      dest: /usr/local/sbin/olamide-github-deploy
      owner: root
      group: root
      mode: '0700'
      content: |
        #!/usr/bin/python3
        """Operator-owned domain deployment. Installed by deploy-all-github-sites.yml."""
        import argparse
        import fcntl
        import grp
        import html
        import json
        import os
        from pathlib import Path
        import pwd
        import re
        import secrets
        import shutil
        import socket
        import sqlite3
        import subprocess
        import tarfile
        import tempfile
        import time
        import urllib.request

        BASE = Path('/var/lib/olamide-github-deploy')
        MARK = '# Managed by olamide-github-deploy v1\n'
        CFG = {}

        def run(args, cwd=None, env=None, timeout=300):
            if args[0] == 'git':
                env = dict(os.environ if env is None else env, GIT_TERMINAL_PROMPT='0')
            return subprocess.run(args, cwd=cwd, env=env, check=True, capture_output=True,
                                  text=True, timeout=timeout).stdout.strip()

        def write(path, text, mode=0o600):
            path = Path(path)
            path.parent.mkdir(parents=True, exist_ok=True)
            tmp = path.with_name(path.name + '.tmp')
            tmp.write_text(text)
            tmp.chmod(mode)
            tmp.replace(path)

        def account(name, data):
            try:
                user = pwd.getpwnam(name)
            except KeyError:
                run(['useradd', '--system', '--no-create-home', '--shell', '/usr/sbin/nologin', name])
                user = pwd.getpwnam(name)
            data.mkdir(parents=True, exist_ok=True, mode=0o700)
            os.chown(data, user.pw_uid, user.pw_gid)
            data.chmod(0o700)
            return user

        def checkout(site):
            repo = site.get('repo')
            if not repo:
                return None
            if not re.fullmatch(r'olamidebello/[A-Za-z0-9_.-]+', repo):
                raise ValueError('Repository must be an olamidebello/name identifier')
            url = 'https://github.com/' + repo + '.git'
            branch = site.get('branch', 'main')
            try:
                refs = run(['git', 'ls-remote', '--heads', url, 'refs/heads/' + branch], timeout=90)
            except subprocess.CalledProcessError:
                # Missing/private/inaccessible source remains untouched and is retried later.
                return None
            if not refs:
                return None
            sha = refs.split()[0]
            root = BASE / 'sources' / site['domain']
            if root.exists():
                if run(['git', 'remote', 'get-url', 'origin'], cwd=root) != url:
                    raise RuntimeError('Unexpected Git origin; refusing to change checkout')
                # v1 cloned with --no-checkout. Preserve that incomplete repository and
                # replace it only when the worktree contains absolutely nothing but .git.
                if {p.name for p in root.iterdir()} == {'.git'}:
                    saved = BASE / 'backups' / site['domain'] / ('incomplete-checkout-' + str(time.time_ns()))
                    saved.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
                    root.rename(saved)
            if not root.exists():
                root.parent.mkdir(parents=True, exist_ok=True)
                with tempfile.TemporaryDirectory(prefix='.clone-', dir=root.parent) as staging:
                    staged = Path(staging) / 'repository'
                    # Materialize the index and worktree before checking for local edits.
                    run(['git', 'clone', '--branch', branch, '--single-branch', url, str(staged)], timeout=600)
                    staged.rename(root)
            if run(['git', 'status', '--porcelain'], cwd=root):
                raise RuntimeError('Source checkout has local changes; refusing to overwrite')
            run(['git', 'fetch', 'origin', 'refs/heads/' + branch], cwd=root, timeout=600)
            sha = run(['git', 'rev-parse', 'FETCH_HEAD'], cwd=root)
            run(['git', 'checkout', '--detach', sha], cwd=root)
            return root, sha

        def export(root, sha, dest):
            dest.mkdir(parents=True, exist_ok=True, mode=0o755)
            with tempfile.TemporaryFile() as archive:
                subprocess.run(['git', 'archive', sha], cwd=root, stdout=archive, check=True)
                archive.seek(0)
                with tarfile.open(fileobj=archive) as tf:
                    # Repositories are executable trusted source, but links must not escape releases.
                    for member in tf.getmembers():
                        if member.issym() or member.islnk() or member.name.startswith('/') or '..' in Path(member.name).parts:
                            raise RuntimeError('Unsafe archive member')
                    tf.extractall(dest)
            for path in [dest, *dest.rglob('*')]:
                path.chmod(0o755 if path.is_dir() or path.stat().st_mode & 0o111 else 0o644)

        def switch(link, target):
            link = Path(link)
            if link.exists() and not link.is_symlink():
                raise RuntimeError('Refusing to replace non-symlink deployment path: ' + str(link))
            tmp = link.with_name(link.name + '.next')
            tmp.unlink(missing_ok=True)
            tmp.symlink_to(target)
            tmp.replace(link)

        def health(port, route='/'):
            for attempt in range(15):
                try:
                    with urllib.request.urlopen('http://127.0.0.1:' + str(port) + route, timeout=3) as response:
                        if response.status == 200:
                            return
                except Exception:
                    pass
                time.sleep(1)
            raise RuntimeError('Backend readiness failed on port ' + str(port))

        def service_exists(name):
            return run(['systemctl', 'show', name, '--property=LoadState', '--value']) != 'not-found'

        def backup_sqlite(data, backup):
            if not data.exists():
                return
            backup.mkdir(parents=True, exist_ok=True, mode=0o700)
            for p in data.rglob('*'):
                if p.is_symlink():
                    raise RuntimeError('Symlink in persistent data requires operator review')
                if p.is_file() and p.suffix not in ('.db', '.sqlite3', '.sqlite') and not p.name.endswith(('-wal', '-shm', '-journal')):
                    target = backup / p.relative_to(data)
                    target.parent.mkdir(parents=True, exist_ok=True)
                    shutil.copy2(p, target)
            for p in data.rglob('*'):
                if p.is_file() and p.suffix in ('.db', '.sqlite3', '.sqlite'):
                    target = backup / p.relative_to(data)
                    target.parent.mkdir(parents=True, exist_ok=True)
                    with sqlite3.connect(str(p)) as source, sqlite3.connect(str(target)) as output:
                        source.backup(output)

        def app(site, root, sha):
            kind, name, port = site['kind'], site['service'], site['port']
            user_name = site['user']
            data = Path('/var/lib') / name
            user = account(user_name, data)
            release = BASE / 'releases' / name / sha
            if not release.exists():
                export(root, sha, release)
            entry = 'server.py' if kind == 'dating' else 'app.py'
            if not (release / entry).is_file():
                raise RuntimeError('Expected application entry point missing')
            run(['/usr/bin/python3', '-m', 'compileall', '-q', str(release)])
            base_env = {'PYTHONDONTWRITEBYTECODE': '1', 'PORT': str(port)}
            if kind == 'store':
                base_env.update(STORE_DATA=str(data), COOKIE_SECURE='1', BIND='127.0.0.1')
            elif kind == 'dobhrap':
                base_env.update(DOBHRAP_DB=str(data / 'dobhrap.db'), DOBHRAP_SECURE_COOKIE='1')
            else:
                base_env.update(NEKKED_DB=str(data / 'nekked.sqlite3'), NEKKED_HOST='127.0.0.1',
                                NEKKED_SECURE_COOKIE='1', NEKKED_ORIGIN='https://' + site['domain'])
            link = Path('/opt') / (name + '-github-current')
            old = link.resolve() if link.is_symlink() else None
            unit = Path('/etc/systemd/system') / (name + '.service')
            old_unit = unit.read_text() if unit.exists() else None
            if old_unit and not (old_unit.startswith(MARK) or site.get('adopt_service')):
                raise RuntimeError('Existing service not managed by this playbook')
            # Do not take a port used by another application.
            if not service_exists(name):
                with socket.socket() as sock:
                    sock.bind(('127.0.0.1', port))
            stamp = str(time.time_ns())
            backup = BASE / 'backups' / site['domain'] / stamp
            backup.mkdir(parents=True, mode=0o700)
            if old_unit:
                write(backup / 'service.unit', old_unit)
            if service_exists(name):
                run(['systemctl', 'stop', name])
            try:
                backup_sqlite(data, backup / 'data')
                if kind in ('store', 'dobhrap'):
                    credentials = BASE / 'credentials' / (name + '.json')
                    if credentials.exists():
                        initial = json.loads(credentials.read_text())
                    else:
                        initial = {'email': CFG['admin_email'], 'password': secrets.token_urlsafe(30)}
                        write(credentials, json.dumps(initial, indent=2) + '\n')
                    env = dict(os.environ, **base_env)
                    prefix = 'ADMIN_' if kind == 'store' else 'DOBHRAP_ADMIN_'
                    env[prefix + 'EMAIL'] = initial['email']
                    env[prefix + 'PASSWORD'] = initial['password']
                    # Password stays out of command arguments, logs and service unit.
                    subprocess.run(['/usr/sbin/runuser', '-u', user_name, '--', '/usr/bin/python3', '-c',
                                    'import app; app.init()'], cwd=release, env=env, check=True,
                                   capture_output=True, timeout=60)
                switch(link, release)
                env_lines = '\n'.join('Environment=' + k + '=' + json.dumps(v) for k, v in base_env.items()
                                      if True)
                write(unit, MARK + f'''[Unit]
        Description=GitHub deployment for {site['domain']}
        After=network.target
        [Service]
        User={user_name}
        Group={grp.getgrgid(user.pw_gid).gr_name}
        WorkingDirectory={link}
        {env_lines}
        ExecStart=/usr/bin/python3 {link}/{entry}
        Restart=on-failure
        RestartSec=3
        NoNewPrivileges=true
        PrivateTmp=true
        ProtectHome=true
        ProtectSystem=strict
        ReadWritePaths={data}
        UMask=0077
        [Install]
        WantedBy=multi-user.target
        ''', 0o644)
                run(['systemctl', 'daemon-reload'])
                run(['systemctl', 'enable', '--now', name])
                health(port, site.get('health', '/'))
            except Exception:
                run(['systemctl', 'stop', name])
                if old:
                    switch(link, old)
                if old_unit:
                    write(unit, old_unit, 0o644)
                    run(['systemctl', 'daemon-reload'])
                    run(['systemctl', 'start', name])
                # Data backup is retained; schema rollback is deliberately not guessed.
                raise
            return f'proxy_pass http://127.0.0.1:{port};\nproxy_set_header Host $host;\nproxy_set_header X-Forwarded-Proto $scheme;'

        def panel(site, root, sha):
            current = Path('/opt/olamidepanel')
            python = current / 'venv/bin/python'
            if not python.exists() or not Path('/etc/olamidepanel/database.json').exists():
                raise RuntimeError('Panel needs its initial MySQL/configuration installation before this updater can run')
            if not service_exists('olamidepanel'):
                raise RuntimeError('Existing olamidepanel systemd service required')
            backup = BASE / 'backups' / site['domain'] / str(time.time_ns())
            backup.mkdir(parents=True, mode=0o700)
            run(['systemctl', 'stop', 'olamidepanel'])
            old = current / 'panel'
            try:
                shutil.copytree(old, backup / 'panel')
                shutil.copy2('/etc/olamidepanel/database.json', backup / 'database.json')
                if Path('/var/lib/olamidepanel').exists():
                    shutil.copytree('/var/lib/olamidepanel', backup / 'data', symlinks=True)
                # Transaction-consistent logical MySQL backup through the existing adapter.
                dump = '''import sys
        sys.path.insert(0, '/opt/olamidepanel/panel')
        import database, pymysql
        c=pymysql.connect(**database.configuration())
        with c.cursor() as q:
         q.execute('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ')
         q.execute('START TRANSACTION WITH CONSISTENT SNAPSHOT')
         q.execute('SHOW TABLES'); tables=[next(iter(row.values())) for row in q.fetchall()]
         print('SET FOREIGN_KEY_CHECKS=0;')
         for name in tables:
          ident='`'+name.replace('`','``')+'`'
          q.execute('SHOW CREATE TABLE '+ident); row=q.fetchone()
          print('DROP TABLE IF EXISTS '+ident+';'); print(row['Create Table']+';')
          q.execute('SELECT * FROM '+ident)
          for row in q.fetchall():
           cols=','.join('`'+k.replace('`','``')+'`' for k in row)
           print('INSERT INTO '+ident+' ('+cols+') VALUES ('+','.join(c.escape(v) for v in row.values())+');')
         print('SET FOREIGN_KEY_CHECKS=1;')
        c.rollback(); c.close()
        '''
                with (backup / 'database.sql').open('w') as out:
                    subprocess.run([str(python), '-c', dump], stdout=out, stderr=subprocess.PIPE, check=True, timeout=600)
                stage = BASE / 'releases' / 'olamidepanel' / sha
                if not stage.exists():
                    export(root, sha, stage)
                run([str(python), '-m', 'pip', 'install', '-r', str(stage / 'requirements.txt')], timeout=600)
                run([str(python), '-m', 'compileall', '-q', str(stage / 'panel')])
                shutil.copytree(stage / 'panel', old, dirs_exist_ok=True)
                run(['systemctl', 'start', 'olamidepanel'])
                health(site['port'])
            except Exception:
                if (backup / 'panel').exists():
                    shutil.copytree(backup / 'panel', old, dirs_exist_ok=True)
                run(['systemctl', 'start', 'olamidepanel'])
                raise
            return f"proxy_pass http://127.0.0.1:{site['port']};\nproxy_set_header Host $host;\nproxy_set_header X-Forwarded-Proto $scheme;"

        def browser(site, root, sha):
            # Build the maintained website; never regenerate the obsolete placeholder.
            dest = BASE / 'public' / site['domain'] / sha
            dest.parent.mkdir(parents=True, exist_ok=True, mode=0o755)
            with tempfile.TemporaryDirectory(prefix='browser-site-', dir=dest.parent) as temporary:
                stage = Path(temporary) / 'site'
                run(['/usr/bin/python3', str(root / 'scripts/build_website.py'),
                     '--output', str(stage)], cwd=root)
                required = ['index.html', 'assets/africanbrowser-logo.png',
                            'assets/africanbrowser-icon.png', 'legal/privacy.html',
                            'legal/terms.html', 'legal/license.html',
                            'legal/notices.html', 'legal/copyright.html']
                for relative in required:
                    if not (stage / relative).is_file():
                        raise RuntimeError('Website build missing ' + relative)
                if 'Download development APK' not in (stage / 'index.html').read_text():
                    raise RuntimeError('Website build missing download action')
                shutil.copy2(stage / 'assets/africanbrowser-logo.png', stage / 'logo.png')
                # Publish dependencies before atomically replacing the homepage.
                dest.mkdir(parents=True, exist_ok=True, mode=0o755)
                for directory in ('assets', 'legal'):
                    shutil.copytree(stage / directory, dest / directory, dirs_exist_ok=True)
                shutil.copy2(stage / 'logo.png', dest / 'logo.png')
                for path in [dest, *dest.rglob('*')]:
                    path.chmod(0o755 if path.is_dir() else 0o644)
                write(dest / 'index.html', (stage / 'index.html').read_text(), 0o644)
            return 'root ' + str(dest) + ';\nindex index.html;\ntry_files $uri $uri/ =404;'

        def static_site(site, root, sha):
            # An explicitly mapped prebuilt static website, never the repository root.
            relative = site.get('public_dir', 'public')
            if Path(relative).is_absolute() or '..' in Path(relative).parts or relative in ('', '.'):
                raise RuntimeError('Set public_dir to a dedicated prebuilt public directory')
            source = (root / relative).resolve()
            if not source.is_relative_to(root.resolve()) or not (source / 'index.html').is_file():
                raise RuntimeError('Static repository needs public_dir/index.html; no build stack is guessed')
            dest = BASE / 'public' / site['domain'] / sha
            if not dest.exists():
                dest.parent.mkdir(parents=True, exist_ok=True, mode=0o755)
                for path in source.rglob('*'):
                    if path.is_symlink() or path.name.startswith('.') or path.suffix in ('.py', '.php', '.sql', '.env'):
                        raise RuntimeError('Static public directory contains private or executable server files')
                shutil.copytree(source, dest)
                for path in [dest, *dest.rglob('*')]:
                    path.chmod(0o755 if path.is_dir() else 0o644)
            return 'root ' + str(dest) + ';\nindex index.html;\ntry_files $uri $uri/ =404;'

        def conflicts(domain, target):
            dump = run(['nginx', '-T'])
            chunks = re.split(r'^# configuration file (.+):\s*$', dump, flags=re.M)
            for i in range(1, len(chunks), 2):
                path, text = Path(chunks[i].strip()), chunks[i+1]
                if path.resolve() == target.resolve():
                    continue
                text = re.sub(r'#[^\n]*', '', text)
                names = [x for value in re.findall(r'\bserver_name\s+([^;]+);', text) for x in value.split()]
                for name in names:
                    for host in (domain, 'www.' + domain):
                        match = (name.strip('\"\'').lower() == host or name.startswith('~') or
                                 name.startswith('*.') and host.endswith(name[1:]) or
                                 name.startswith('.') and (host == name[1:] or host.endswith(name)) or
                                 name.endswith('.*') and host.startswith(name[:-1]))
                        if match:
                            raise RuntimeError('Conflicting existing Nginx host in ' + str(path))

        def dns_ready(host):
            import dns.resolver
            for ns in ('1.1.1.1', '8.8.8.8'):
                resolver = dns.resolver.Resolver(configure=False)
                resolver.nameservers = [ns]
                resolver.lifetime = 5
                try:
                    if {str(a) for a in resolver.resolve(host, 'A')} != {CFG['server_ipv4']}:
                        return False
                    try:
                        if list(resolver.resolve(host, 'AAAA')):
                            return False
                    except dns.resolver.NoAnswer:
                        pass
                except dns.exception.DNSException:
                    return False
            return True

        def vhost(site, location):
            domain = site['domain']
            target = Path('/etc/nginx/sites-available') / ('olamide-auto-' + domain)
            conflicts(domain, target)
            previous = target.read_text() if target.exists() else None
            if previous and not (previous.startswith(MARK) or previous.startswith('# Managed by olamide-six-domains v1\n')):
                raise RuntimeError('Unmanaged vhost; replacement refused')
            cert = Path('/etc/letsencrypt/live') / domain
            tls = (cert / 'fullchain.pem').exists() and (cert / 'privkey.pem').exists()
            hosts = [domain]
            www_ready = dns_ready('www.' + domain)
            if www_ready:
                hosts.append('www.' + domain)
            acme = 'location ^~ /.well-known/acme-challenge/ { root /var/lib/olamide-six-domains/acme; }\n'
            content = MARK + 'server { listen 80; server_name ' + ' '.join(hosts) + ';\n' + acme
            if tls:
                content += 'location / { return 301 https://' + domain + '$request_uri; }\n}\n'
                content += 'server { listen 443 ssl; server_name ' + ' '.join(hosts) + ';\n'
                content += 'ssl_certificate ' + str(cert / 'fullchain.pem') + ';\nssl_certificate_key ' + str(cert / 'privkey.pem') + ';\n'
            content += 'client_max_body_size 25m;\nlocation / {\n' + location + '\n}\n}\n'
            link = Path('/etc/nginx/sites-enabled') / target.name
            if link.exists() or link.is_symlink():
                if not link.is_symlink() or link.resolve() != target.resolve():
                    raise RuntimeError('Unexpected enabled Nginx file')
            if previous != content:
                if previous:
                    write(BASE / 'backups' / domain / (str(time.time_ns()) + '.nginx'), previous)
                write(target, content, 0o644)
            made_link = not link.is_symlink()
            if made_link:
                link.symlink_to(target)
            try:
                run(['nginx', '-t'])
                run(['systemctl', 'reload', 'nginx'])
            except Exception:
                if previous is not None:
                    write(target, previous, 0o644)
                else:
                    target.unlink(missing_ok=True)
                if made_link:
                    link.unlink(missing_ok=True)
                run(['nginx', '-t'])
                run(['systemctl', 'reload', 'nginx'])
                raise
            if not dns_ready(domain):
                return {'status': 'deployed_waiting_dns', 'www': 'ready' if www_ready else 'waiting_dns'}
            # Certbot plugin expands existing certificates and preserves proxy configuration.
            args = ['certbot', '--nginx', '--non-interactive', '--agree-tos', '--redirect',
                    '--keep-until-expiring', '--expand', '--cert-name', domain, '-m', CFG['admin_email']]
            for host in hosts:
                args.extend(['-d', host])
            try:
                run(args, timeout=240)
                run(['nginx', '-t'])
                run(['systemctl', 'reload', 'nginx'])
                # Uses normal public DNS and validates certificate trust and hostname.
                with urllib.request.urlopen('https://' + domain + '/', timeout=20) as response:
                    if response.status != 200:
                        raise RuntimeError('Public HTTPS health failed')
                return {'status': 'https_ready', 'www': 'ready' if www_ready else 'waiting_dns'}
            except Exception as exc:
                return {'status': 'deployed_tls_needs_attention', 'detail': type(exc).__name__,
                        'www': 'ready' if www_ready else 'waiting_dns'}

        def publish_panel_snapshot(results):
            panel_data = Path('/var/lib/olamidepanel')
            try:
                group_id = grp.getgrnam('olamidepanel').gr_gid
            except KeyError:
                return
            if not panel_data.is_dir():
                return
            snapshot = panel_data / 'hosted-domains.json'
            try:
                previous = json.loads(snapshot.read_text())
                rows = {r['domain']: r for r in previous.get('domains', []) if isinstance(r, dict) and 'domain' in r}
            except (OSError, ValueError, TypeError, KeyError):
                rows = {}
            for result in results:
                name = result['domain']
                if result['status'] == 'waiting_repository' and name in rows:
                    # Existing static hosting remains valid; source availability is separate.
                    row = dict(rows[name], deployment_status='waiting_repository',
                               deployment_checked_at=result['checked_at'])
                else:
                    # Replace obsolete roots rather than merging them into application status.
                    row = {k: v for k, v in result.items() if k != 'location'}
                    row['deployment_status'] = 'running' if result.get('application_ready') else result['status']
                    row['deployment_checked_at'] = result['checked_at']
                    if result.get('application_ready'):
                        location = result.get('location', '')
                        backend = re.search(r'proxy_pass (http://127[.]0[.]0[.]1:[0-9]+);', location)
                        document = re.search(r'^root ([^;]+);', location)
                        if backend:
                            row['backend'] = backend.group(1)
                        if document:
                            row['document_root'] = document.group(1)
                rows[name] = row
            write(snapshot, json.dumps({'updated_at': int(time.time()), 'domains': list(rows.values())}, indent=2) + '\n', 0o640)
            os.chown(snapshot, 0, group_id)

        def main():
            global CFG
            parser = argparse.ArgumentParser()
            parser.add_argument('--domain', help='Deploy only this configured domain')
            args = parser.parse_args()
            os.umask(0o077)
            CFG = json.loads(Path('/etc/olamide-github-deploy.json').read_text())
            if args.domain and not any(site['domain'] == args.domain for site in CFG['sites']):
                raise SystemExit('Domain is not configured')
            with (BASE / 'worker.lock').open('w') as lock:
                try:
                    fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
                except BlockingIOError:
                    print('Deployment already running')
                    return
                results = []
                report = BASE / 'status.json'
                if args.domain and report.exists():
                    results = [row for row in json.loads(report.read_text()) if row['domain'] != args.domain]
                for site in CFG['sites']:
                    if args.domain and site['domain'] != args.domain:
                        continue
                    result = {'domain': site['domain'], 'checked_at': int(time.time()), 'repo': site.get('repo')}
                    try:
                        target = Path('/etc/nginx/sites-available') / ('olamide-auto-' + site['domain'])
                        # Check conflicts before stopping applications or updating code.
                        conflicts(site['domain'], target)
                        source = checkout(site)
                        if source is None:
                            result['status'] = 'waiting_repository'
                        else:
                            root, sha = source
                            result['commit'] = sha
                            previous_path = BASE / 'status' / (site['domain'] + '.json')
                            previous = json.loads(previous_path.read_text()) if previous_path.exists() else {}
                            if site['kind'] != 'browser' and previous.get('commit') == sha and previous.get('application_ready'):
                                location = previous['location']
                                if site.get('port'):
                                    health(site['port'], site.get('health', '/'))
                            else:
                                if site['kind'] == 'panel':
                                    location = panel(site, root, sha)
                                elif site['kind'] == 'browser':
                                    location = browser(site, root, sha)
                                elif site['kind'] == 'static':
                                    location = static_site(site, root, sha)
                                else:
                                    location = app(site, root, sha)
                            result.update(application_ready=True, location=location)
                            result.update(vhost(site, location))
                    except Exception as exc:
                        # Avoid leaking SQL credentials, process environment or HTTP response bodies.
                        result.update(status='needs_attention', error=str(exc) if isinstance(exc, (RuntimeError, ValueError)) else type(exc).__name__)
                    write(BASE / 'status' / (site['domain'] + '.json'), json.dumps(result, indent=2) + '\n', 0o644)
                    results.append(result)
                write(BASE / 'status.json', json.dumps(results, indent=2) + '\n', 0o644)
                publish_panel_snapshot(results)
                print(json.dumps(results, indent=2))

        if __name__ == '__main__':
            main()
  - name: Check worker Python syntax
    ansible.builtin.command: python3 -m py_compile /usr/local/sbin/olamide-github-deploy
    changed_when: false
  - name: Inspect previous static hosting retry timer
    ansible.builtin.stat:
      path: /etc/systemd/system/olamide-six-domains.timer
    register: old_hosting_timer
  - name: Disable previous timer so it cannot rewrite deployed application proxies
    ansible.builtin.systemd:
      name: olamide-six-domains.timer
      enabled: false
      state: stopped
    when: old_hosting_timer.stat.exists
  - name: Wait for any existing static hosting worker to finish
    ansible.builtin.command: systemctl is-active olamide-six-domains.service
    register: old_hosting_worker
    failed_when: false
    changed_when: false
    until: old_hosting_worker.stdout not in ['active', 'activating', 'deactivating']
    retries: 300
    delay: 10
    when: old_hosting_timer.stat.exists
  - name: Install deployment service
    ansible.builtin.copy:
      dest: /etc/systemd/system/olamide-github-deploy.service
      mode: '0644'
      content: |
        [Unit]
        Description=Pull and deploy operator GitHub websites
        Wants=network-online.target
        After=network-online.target nginx.service
        [Service]
        Type=oneshot
        User=root
        UMask=0077
        ExecStart=/usr/local/sbin/olamide-github-deploy
        TimeoutStartSec=2h
  - name: Install hourly repository and DNS retry timer
    ansible.builtin.copy:
      dest: /etc/systemd/system/olamide-github-deploy.timer
      mode: '0644'
      content: |
        [Unit]
        Description=Retry repository deployment and DNS/HTTPS every hour
        [Timer]
        OnBootSec=5min
        OnUnitInactiveSec=1h
        RandomizedDelaySec=120
        Unit=olamide-github-deploy.service
        [Install]
        WantedBy=timers.target
  - name: Enable Nginx and certificate renewal
    ansible.builtin.systemd:
      name: '{{ item }}'
      enabled: true
      state: started
      daemon_reload: true
    loop:
    - nginx
    - certbot.timer
  - name: Run pull, backup, deployment and health checks
    ansible.builtin.command: /usr/local/sbin/olamide-github-deploy
    async: 7200
    poll: 10
    register: deployment_run
    changed_when: true
    when: not ansible_check_mode
  - name: Configure periodic automatic deployment
    ansible.builtin.systemd:
      name: olamide-github-deploy.timer
      enabled: '{{ deployment_auto_update | bool }}'
      state: '{{ ''started'' if deployment_auto_update | bool else ''stopped'' }}'
      daemon_reload: true
  - name: Show actual deployment outcomes
    ansible.builtin.debug:
      var: deployment_run.stdout_lines
    when: not ansible_check_mode
  - name: Read per-domain outcome report
    ansible.builtin.slurp:
      src: /var/lib/olamide-github-deploy/status.json
    register: deployment_report
    when: not ansible_check_mode
  - name: Report incomplete deployments as a failed play while retaining successful sites and retries
    ansible.builtin.assert:
      that:
      - deployment_report.content | b64decode | from_json | selectattr('status', 'equalto', 'needs_attention') |
        list | length == 0
      - deployment_report.content | b64decode | from_json | selectattr('status', 'equalto', 'deployed_tls_needs_attention')
        | list | length == 0
      fail_msg: Some sites need attention. Read the report above; successful sites remain deployed and the retry
        timer is configured.
    when: not ansible_check_mode
